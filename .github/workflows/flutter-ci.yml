name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test, and build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          key_password="$(openssl rand -hex 24)"
          echo "::add-mask::$key_password"
          keytool -genkeypair -noprompt -v \
            -keystore "$GITHUB_WORKSPACE/android/ci-release.jks" \
            -storepass "$key_password" -keypass "$key_password" \
            -alias ci-release -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Temporary CI Signing Key"
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/ci-release.jks
          storePassword=$key_password
          keyAlias=ci-release
          keyPassword=$key_password
          EOF
      - name: Build signed Android release APK
        run: flutter build apk --release
      - name: Verify signed Android release APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties android/ci-release.jks
